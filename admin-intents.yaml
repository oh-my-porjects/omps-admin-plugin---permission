$schema: admin-ui-intent/v1
module: permission

pages:
  - key: permission.list
    title: { fallback: 权限点 }
    description: { fallback: 维护项目后台可分配的权限点。 }
    route: /system/permissions
    menu_key: system.permissions
    menu_title: { fallback: 权限点 }
    menu_path:
      - { key: system, title: { fallback: 系统管理 }, icon: settings, order: 900 }
      - { key: system.access, title: { fallback: 账号与权限 }, icon: shield, order: 10 }
    icon: shield
    order: 120
    template: { id: standard-list, version: 1.0.0 }
    size: md
    query_capability: permission.endpoint.get_api_permission_list
    pagination: true
    filters:
      - key: keyword
        binding: keyword
        label: { fallback: 权限关键词 }
        control: search
    columns:
      - field: permission_id
        title: { fallback: 权限 ID }
        min_width: 180
      - field: code
        title: { fallback: 权限码 }
        min_width: 220
      - field: name
        title: { fallback: 名称 }
        min_width: 140
      - field: description
        title: { fallback: 说明 }
        min_width: 240
      - field: created_at
        title: { fallback: 创建时间 }
        min_width: 180
    actions:
      - key: permission.list.action.create
        type: navigate
        source: page
        title: { fallback: 新建权限点 }
        target_page_key: permission.create

  - key: permission.create
    title: { fallback: 新建权限点 }
    route: /system/permissions/create
    menu_hidden: true
    menu_key: system.permission_create
    menu_title: { fallback: 新建权限点 }
    order: 121
    template: { id: standard-form, version: 1.0.0 }
    size: md
    fields:
      - binding: code
        label: { fallback: 权限码 }
        control: input
        required: true
        placeholder: { fallback: 例如 admin.account.manage }
      - binding: name
        label: { fallback: 名称 }
        control: input
        required: true
      - binding: description
        label: { fallback: 说明 }
        control: textarea
    actions:
      - key: permission.create.action.submit
        type: submit
        source: form
        title: { fallback: 创建权限点 }
        capability_key: permission.endpoint.post_api_permission_create
        danger: confirm
        confirm:
          title: { fallback: 确认创建权限点？ }
          description: { fallback: 新权限点创建后可被角色引用并影响后台访问控制。 }
        bindings:
          code: { source: form, key: code, required: true }
          name: { source: form, key: name, required: true }
          description: { source: form, key: description }

  - key: permission.role_bindings
    title: { fallback: 角色权限绑定 }
    description: { fallback: 查看角色已绑定的权限点，并进入受控分配页面。 }
    route: /system/role-permissions
    menu_key: system.role_permissions
    menu_title: { fallback: 角色权限绑定 }
    menu_path:
      - { key: system, title: { fallback: 系统管理 }, icon: settings, order: 900 }
      - { key: system.access, title: { fallback: 账号与权限 }, icon: shield, order: 10 }
    icon: key
    order: 121
    template: { id: standard-list, version: 1.0.0 }
    size: md
    query_capability: permission.endpoint.get_api_permission_role_permissions
    pagination: true
    filters:
      - key: role_id
        binding: role_id
        label: { fallback: 角色 ID }
        control: search
    columns:
      - field: role_id
        title: { fallback: 角色 ID }
        min_width: 180
      - field: role_name
        title: { fallback: 角色 }
        min_width: 140
      - field: permission_id
        title: { fallback: 权限 ID }
        min_width: 180
      - field: permission_code
        title: { fallback: 权限码 }
        min_width: 220
      - field: permission_name
        title: { fallback: 权限名称 }
        min_width: 160
      - field: created_at
        title: { fallback: 绑定时间 }
        min_width: 180
    actions:
      - key: permission.role_bindings.action.assign
        type: navigate
        source: row
        title: { fallback: 分配权限 }
        target_page_key: permission.assign
        bindings:
          role_id: { source: row, key: role_id, required: true }

  - key: permission.assign
    title: { fallback: 分配角色权限 }
    route: /system/role-permissions/assign
    menu_hidden: true
    menu_key: system.permission_assign
    menu_title: { fallback: 分配角色权限 }
    order: 122
    template: { id: standard-form, version: 1.0.0 }
    size: md
    fields:
      - binding: permission_ids
        label: { fallback: 权限 ID 列表 }
        control: input-tag
        required: true
        placeholder: { fallback: 输入权限 ID 后按回车添加 }
    actions:
      - key: permission.assign.action.submit
        type: submit
        source: form
        title: { fallback: 保存权限绑定 }
        capability_key: permission.endpoint.put_api_permission_assign_permissions
        danger: confirm
        confirm:
          title: { fallback: 确认更新角色权限？ }
          description: { fallback: 保存后将覆盖当前角色的权限绑定。 }
        bindings:
          role_id: { source: route, key: role_id, required: true }
          permission_ids: { source: form, key: permission_ids, required: true, fallback: [] }
