# 模块声明契约（稳定事实源）
# 只放需要进入 Git 评审的模块事实；派生索引由 admin-server 写入工作区 .gitNexus/module-indexes/。
title: "权限管理"
summary: "权限点公共模块，负责权限点维护、角色权限绑定、权限列表和权限校验，并兼容 role 模块表。"

tables:
  owner_tables:
    - "permission_roles"
    - "permission_permissions"
    - "permission_role_permissions"

lifecycle:
  state_strategy: externalized
  shutdown_requirements:
    - "后台 worker 必须监听 LifecycleCtx/IsUnloading，在模块卸载或重载时停止接收新任务并协作退出。"
  reload_risks: []

background_tasks:
  exit_policy: cooperative_cancel

realtime:
  user_ws_events: []
  admin_events: []
