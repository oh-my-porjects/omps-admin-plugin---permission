module: permission
module_title: 权限管理
menus:
  - key: permissions
    title: 权限点
    icon: safety
    roles: [admin, developer]
    views: [permission_list]
  - key: role_bindings
    title: 角色-权限绑定
    icon: api
    roles: [admin, developer]
    views: [role_permission_binding]
views:
  - key: permission_list
    type: table
    title: 权限点
    api: GET /api/permission/list
    columns:
      - field: id
        title: ID
      - field: code
        title: 权限码
      - field: name
        title: 名称
      - field: description
        title: 说明
    actions:
      - key: create
        type: page
        title: 新建权限点
        api: POST /api/permission/create
  - key: role_permission_binding
    type: table
    title: 角色权限绑定
    api: GET /api/permission/role-permissions
    columns:
      - field: role_id
        title: 角色 ID
      - field: permission_id
        title: 权限 ID
roles:
  - code: admin
    title: 超级管理员
  - code: developer
    title: 开发者
